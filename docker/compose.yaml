name: magnetar

services:
  password:
    image: postgres:18
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -s /run/magnetar/db-password ]; then
          umask 022
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/magnetar/db-password
        fi
    volumes:
      - secrets:/run/magnetar
    restart: "no"

  postgres:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      password:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: magnetar
      POSTGRES_DB: magnetar
      POSTGRES_PASSWORD_FILE: /run/magnetar/db-password
    volumes:
      - pgdata:/var/lib/postgresql
      - secrets:/run/magnetar:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magnetar -d magnetar"]
      interval: 5s
      timeout: 3s
      retries: 20

  magnetar:
    image: ${MAGNETAR_IMAGE:-ghcr.io/wikitteam/magnetar:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://magnetar@postgres:5432/magnetar?sslmode=disable
      MAGNETAR_DATABASE_PASSWORD_FILE: /run/magnetar/db-password
    volumes:
      - data:/data
      - secrets:/run/magnetar:ro
    ports:
      - "${MAGNETAR_PORT:-8080}:8080"

volumes:
  data:
  pgdata:
  secrets:
